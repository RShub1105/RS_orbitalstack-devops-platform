apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry-ingestor-staging
  namespace: argocd
spec:
  project: orbital-staging
  source:
    repoURL: https://github.com/example/orbitalstack-devops-platform.git
    targetRevision: HEAD
    path: helm/charts/telemetry-ingestor
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: orbital-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

