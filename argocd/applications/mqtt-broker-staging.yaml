apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mqtt-broker-staging
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: platform-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-alerts
spec:
  project: orbital-staging
  source:
    repoURL: https://github.com/example/orbitalstack-devops-platform.git
    targetRevision: HEAD
    path: helm/charts/mqtt-broker
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: orbital-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

