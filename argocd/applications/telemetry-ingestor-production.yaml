apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry-ingestor-production
  namespace: argocd
spec:
  project: orbital-production
  source:
    repoURL: https://github.com/example/orbitalstack-devops-platform.git
    targetRevision: HEAD
    path: helm/charts/telemetry-ingestor
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: orbital-production

