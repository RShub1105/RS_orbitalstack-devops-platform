namespaceOverride: ""
image:
  repository: local.registry/orbital/telemetry-ingestor
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 3
serviceAccount:
  create: true
  name: ""
  annotations:
    eks.amazonaws.com/role-arn: ""
service:
  port: 8080
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 2
    maxUnavailable: 0
podDisruptionBudget:
  enabled: true
  minAvailable: 2
probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 15
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  cpuAverageUtilization: 70
  customMetric:
    name: messages_per_second
    targetAverageValue: "5000"
config:
  logLevel: info
externalSecret:
  enabled: true
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  targetName: telemetry-ingestor-secrets
  data:
    - secretKey: database_url
      remoteRef:
        key: /orbital/timescaledb
        property: url
serviceMonitor:
  enabled: true
  interval: 30s
ingress:
  enabled: false
networkPolicy:
  enabled: true
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mqtt-broker
          topologyKey: kubernetes.io/hostname
