apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "device-api.fullname" . }}
  namespace: {{ include "device-api.namespace" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
{{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: device-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-api
    spec:
      serviceAccountName: {{ default (include "device-api.fullname" .) .Values.serviceAccount.name }}
      containers:
        - name: device-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "device-api.fullname" . }}
            - secretRef:
                name: {{ .Values.externalSecret.targetName }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
{{- toYaml .Values.resources | nindent 12 }}

