apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ota-controller.fullname" . }}
  namespace: {{ include "ota-controller.namespace" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ota-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ota-controller
    spec:
      serviceAccountName: {{ default (include "ota-controller.fullname" .) .Values.serviceAccount.name }}
      containers:
        - name: ota-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "ota-controller.fullname" . }}
            - secretRef:
                name: {{ .Values.externalSecret.targetName }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - wget -qO- --post-data='' http://127.0.0.1:{{ .Values.service.port }}/drain || true
          resources:
{{- toYaml .Values.resources | nindent 12 }}
        - name: leader-elector
          image: {{ .Values.leaderElection.sidecarImage }}
          args:
            - --election=ota-controller
            - --http=0.0.0.0:4040
            - --lease-duration={{ .Values.leaderElection.leaseDurationSeconds }}
            - --renew-deadline={{ .Values.leaderElection.renewDeadlineSeconds }}
            - --retry-period={{ .Values.leaderElection.retryPeriodSeconds }}

